<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realistic Page Flip</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/stpageflip@1.0.6/dist/css/page-flip.min.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }

      #book {
        width: 800px;
        height: 500px;
      }

      .page {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: white;
        padding: 2rem;
      }

      .page:nth-child(odd) {
        background-color: #6c5ce7;
      }

      .page:nth-child(even) {
        background-color: #00b894;
      }
    </style>
  </head>
  <body>
    <div id="book">
      <div class="page">Page 1 - Welcome</div>
      <div class="page">Page 2 - About</div>
      <div class="page">Page 3 - Projects</div>
      <div class="page">Page 4 - Contact</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
      const pageFlip = new St.PageFlip(document.getElementById("book"), {
        width: 400,
        height: 500,
        size: "fixed",
        maxShadowOpacity: 0.5,
        showCover: false,
        mobileScrollSupport: false,
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));
    </script>
  </body>
</html>
